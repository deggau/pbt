<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PBT - Registro de Jogos</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-mode">
    <div id="authContainer">
        <div class="login-card">
            <h1>PBT - Registro de Jogos</h1>
            <form id="loginForm" class="login-form">
                <div class="form-group"><label for="email">E-mail</label><input type="email" id="email" autocomplete="username" required></div>
                <div class="form-group"><label for="password">Senha</label><input type="password" id="password" autocomplete="current-password" required></div>
                <button type="submit" id="loginBtn">Entrar</button>
                <p id="loginStatus" role="status" aria-live="polite"></p>
            </form>
        </div>
    </div>
    <div id="appContainer" class="hidden">
        <aside class="sidebar">
            <div class="sidebar-header"><h2>Minhas patotas</h2></div>
            <nav id="groupsList" class="groups-scroll-area" aria-label="Patotas"></nav>
            <details class="account-actions"><summary>Conta e opções</summary>
                <button id="createGroupBtn" class="create-group-btn">+ Nova patota</button>
                <button id="exportLocalBtn" class="btn-secondary">Exportar dados locais antigos</button>
                <button id="logoutBtn" class="btn-secondary">Sair</button>
            </details>
        </aside>
        <div class="main-content">
            <header><button id="menuToggle" class="menu-toggle" aria-label="Abrir menu" aria-expanded="false">☰</button><h1 id="pageTitle">Próxima partida</h1></header>
            <p id="appStatus" role="status" aria-live="polite"></p>
            <button id="retryBtn" type="button" hidden>Tentar novamente</button>
            <main id="mainContent"></main>
            <button id="confirmFab" class="confirm-fab" aria-label="Confirmar presença" hidden>👍</button>
        </div>
    </div>
    <dialog id="editorDialog" aria-labelledby="editorTitle">
        <div class="modal-header"><h2 id="editorTitle"></h2><button id="closeEditor" class="close-btn" aria-label="Fechar">×</button></div>
        <form id="editorForm" class="modal-body">
            <div id="editorBody"></div>
            <p id="editorStatus" role="status" aria-live="polite"></p>
            <div class="modal-actions"><button type="submit" id="saveEditor">Salvar</button></div>
        </form>
    </dialog>
    <script type="module" src="auth.js"></script>
</body>
</html>
