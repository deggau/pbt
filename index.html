<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PBT - Registro de Jogos</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-mode">
    <div id="authContainer">
        <div class="login-card">
            <h1>PBT - Registro de Jogos</h1>
            <div class="login-form">
                <div class="form-group">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" placeholder="seu@email.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Senha:</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <button type="button" id="loginBtn" onclick="handleLogin()">Entrar</button>
                <p class="signup-link">Não tem conta? <a href="#">Cadastre-se</a></p>
            </div>
        </div>
    </div>

    <div id="appContainer" class="hidden">
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>Meus Grupos</h2>
                <button class="create-group-btn" id="createGroupBtn" onclick="showCreateGroupModal()">
                    <span class="btn-icon">+</span>
                    <span class="btn-text">Novo Grupo</span>
                </button>
            </div>
            <div id="groupsList" class="groups-scroll-area">
                <!-- Groups will be rendered here -->
            </div>
        </div>
        <div class="main-content">
            <header>
                <h1 id="pageTitle">PBT - Registro de Jogos</h1>
            </header>
            
            <main id="mainContent">
                <!-- Dynamic content will be loaded here -->
            </main>
        </div>
    </div>

    <script src="example-data.js"></script>
    <script src="auth.js"></script>
    <script src="app.js"></script>
</body>
</html>
