services:
  - type: web
    name: pbt
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.18.0
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
